# Docker Compose DNS. Variable-based proxy_pass defers hostname lookup to
# request time so nginx can start even if upstreams are briefly unreachable.
resolver 127.0.0.11 valid=10s ipv6=off;

# Shared PocketBase proxy snippets via repeated blocks (no include required).
# Phase 3: do NOT add a broad /hcgi/platform/ location — tenant collections stay blocked.

server {
  listen 80;
  server_name _;

  # Pin compose uploads are multipart PNGs/JPEGs (often >1MB). Nginx default is 1m → HTTP 413.
  client_max_body_size 25m;

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  location /hcgi/api/ {
    set $api_upstream api:3001;
    rewrite ^/hcgi/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $api_upstream api:3001;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # ---------------------------------------------------------------------------
  # PocketBase users auth allowlist (^~ = highest prefix priority, no regex quirks)
  # Covers: auth-methods, auth-with-password, auth-refresh, auth-with-oauth2, …
  # ---------------------------------------------------------------------------
  location ^~ /hcgi/platform/api/collections/users/auth- {
    set $pocketbase_upstream pocketbase:8090;
    rewrite ^/hcgi/platform/(.*)$ /$1 break;
    proxy_pass http://$pocketbase_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location ^~ /hcgi/platform/api/collections/users/request- {
    set $pocketbase_upstream pocketbase:8090;
    rewrite ^/hcgi/platform/(.*)$ /$1 break;
    proxy_pass http://$pocketbase_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /hcgi/platform/api/collections/users/confirm- {
    set $pocketbase_upstream pocketbase:8090;
    rewrite ^/hcgi/platform/(.*)$ /$1 break;
    proxy_pass http://$pocketbase_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # OAuth2 provider redirect callback (PocketBase global)
  location ^~ /hcgi/platform/api/oauth2-redirect {
    set $pocketbase_upstream pocketbase:8090;
    rewrite ^/hcgi/platform/(.*)$ /$1 break;
    proxy_pass http://$pocketbase_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Signup: POST create only — GET list/search denied
  location = /hcgi/platform/api/collections/users/records {
    limit_except POST {
      deny all;
    }
    set $pocketbase_upstream pocketbase:8090;
    rewrite ^/hcgi/platform/(.*)$ /$1 break;
    proxy_pass http://$pocketbase_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-user profile + external-auths (no collection list)
  location ~ ^/hcgi/platform/api/collections/users/records/[a-zA-Z0-9_-]+(/external-auths(/[^/]+)?)?/?$ {
    limit_except GET PATCH PUT DELETE {
      deny all;
    }
    set $pocketbase_upstream pocketbase:8090;
    rewrite ^/hcgi/platform/(.*)$ /$1 break;
    proxy_pass http://$pocketbase_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # Public PocketBase file serving — unchanged
  location /hcgi/platform/api/files/ {
    set $pocketbase_upstream pocketbase:8090;
    rewrite ^/hcgi/platform/(.*)$ /$1 break;
    proxy_pass http://$pocketbase_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $web_upstream web:80;
    proxy_pass http://$web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
