name: Production Readiness

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Single source of truth: .nvmrc (Node 22) · Dockerfiles use node:22-*
          node-version-file: .nvmrc
          cache: npm

      - name: Assert Node major matches .nvmrc
        run: |
          expected="$(tr -d '[:space:]' < .nvmrc)"
          actual="$(node -p "process.versions.node.split('.')[0]")"
          echo "expected_major=${expected} actual_major=${actual}"
          test "$actual" = "$expected"

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: npm run lint --prefix apps/api

      - name: Lint Web
        run: npm run lint --prefix apps/web

      - name: Schema governance (registry ↔ migration parity)
        run: node --test src/utils/schema-compat-registry.test.js
        working-directory: apps/api

      - name: Test API
        run: npm run test --prefix apps/api

      - name: Test Web
        run: npm run test --prefix apps/web

      - name: Build Web
        run: npm run build --prefix apps/web

  config-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required env keys exist in template
        run: |
          required=(
            "NODE_ENV"
            "PORT"
            "CORS_ORIGIN"
            "PB_BASE_URL"
            "PB_SUPERUSER_EMAIL"
            "PB_SUPERUSER_PASSWORD"
            "PINTEREST_CLIENT_ID"
            "PINTEREST_CLIENT_SECRET"
            "PB_ENCRYPTION_KEY"
            "WORDPRESS_SECRETS_KEY"
          )
          for key in "${required[@]}"; do
            grep -q "^${key}=" apps/api/.env.example || (echo "Missing ${key} in apps/api/.env.example" && exit 1)
          done

      - name: Validate Nginx reverse-proxy config syntax
        run: |
          mkdir -p deploy/nginx/certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout deploy/nginx/certs/privkey.pem \
            -out deploy/nginx/certs/fullchain.pem \
            -subj "/CN=localhost"

          docker run --rm \
            -v "$PWD/deploy/nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/deploy/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t

  docker-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No registry login, no secrets, no compose up, no push.
      # Tags: immutable SHA + ci-smoke alias. Does not touch compose project :latest names.
      - name: Docker build smoke (API)
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            -f Dockerfile.api \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            -t "seodeva-api:${{ github.sha }}" \
            -t seodeva-api:ci-smoke \
            .

      - name: Verify API image OCI revision label
        run: |
          rev="$(docker inspect seodeva-api:ci-smoke --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          echo "label_revision=${rev}"
          echo "expected=${{ github.sha }}"
          test "${rev}" = "${{ github.sha }}"
          created="$(docker inspect seodeva-api:ci-smoke --format '{{ index .Config.Labels "org.opencontainers.image.created" }}')"
          test -n "${created}"
          test "${created}" != "unknown"

      - name: Docker build smoke (Web)
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker build \
            -f Dockerfile.web \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --build-arg VITE_PADDLE_CLIENT_TOKEN= \
            -t "seodeva-web:${{ github.sha }}" \
            -t seodeva-web:ci-smoke \
            .

      - name: Verify Web image OCI revision label
        run: |
          rev="$(docker inspect seodeva-web:ci-smoke --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          echo "label_revision=${rev}"
          echo "expected=${{ github.sha }}"
          test "${rev}" = "${{ github.sha }}"
          created="$(docker inspect seodeva-web:ci-smoke --format '{{ index .Config.Labels "org.opencontainers.image.created" }}')"
          test -n "${created}"
          test "${created}" != "unknown"
